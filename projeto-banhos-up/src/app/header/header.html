<header class="header">
  <div class="header__conteudo">
    <a routerLink="/" class="header__logo" aria-label="Ir para a página inicial">
      <img
        src="assets/logos/RETANGULAR_COMPLETO.png"
        alt="Banhos Up! Banho e Tosa"
      />
    </a>

    <nav class="header__nav" [class.header__nav--aberto]="menuAberto()">
      <a class="header__item" routerLink="/agendamento" (click)="fecharMenu()">
        <svg class="header__icone" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 7v5l3.5 2"></path>
        </svg>
        <span>Agendar</span>
      </a>

      <a class="header__item" routerLink="/agendamento" (click)="fecharMenu()">
        <svg class="header__icone" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4.5 21c.8-4.1 3.4-6.2 7.5-6.2s6.7 2.1 7.5 6.2"></path>
        </svg>
        <span>Olá, User</span>
      </a>
    </nav>

    <div class="header__contato" aria-label="Telefone para contato">
      <svg class="header__icone" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M7.2 3.8 4.9 5.1c-.8.5-1.1 1.5-.8 2.4 2.2 6.4 7.1 11.3 13.5 13.5.9.3 1.9 0 2.4-.8l1.3-2.3c.5-.9.2-2-.7-2.5l-3-1.5c-.8-.4-1.7-.2-2.3.5l-1.1 1.4a15.2 15.2 0 0 1-6-6l1.4-1.1c.7-.6.9-1.5.5-2.3l-1.5-3c-.5-.9-1.6-1.2-2.5-.6Z"
        ></path>
      </svg>

      <span>(11) 98298-1263</span>
    </div>

    <button
      class="header__menu-botao"
      type="button"
      (click)="alternarMenu()"
      [attr.aria-expanded]="menuAberto()"
      aria-label="Abrir ou fechar menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
